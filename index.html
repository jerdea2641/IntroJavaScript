<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage</title>
</head>

<body>
    <!--Personal Welcome message-->
    <h1 id="welcome"></h1>
    
    <!--Navigation Menu-->
    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <!--About Section-->
    <section id="about">
        <h2>About Me</h2>
        <p>
            My name is Jeremy Dean. I am currently studying software development and AI.
            I also own a Dog training business.
        </p>
    </section>

    <!--Projects Section-->
    <section id="projects">
        <h2>Projects</h2>

        <a href="#" target="_blank">
            <img src="project1.png" alt="Project 1" width="200">
        </a>

        <a href="#" target="_blank">
            <img src="project2.png" alt="Project 2" width="200">
        </a>

        <a href="#" target="_blank">
            <img src="project3.png" alt="Project 3" width="200">
        </a>
    </section>

    <!--Contact Section-->
    <section id="contact">
        <h2>Contact</h2>
        
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>

    <!--JavaScript for personalized message-->
    <script>
        var userName = prompt("What is your name?");
        document.getElementById("welcome").textContent = "Welcome, " + userName + "!";
    </script>

</body>
</html>
